<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#071c2d">
<title>Island Tycoon 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;font-family:Arial,sans-serif;background:#071c2d;color:white}
#game{position:fixed;inset:0}
canvas{display:block}
.panel{position:fixed;z-index:3;background:#102b40ef;border:1px solid #4bd5d0;border-radius:14px;padding:12px;box-shadow:0 5px 20px #0005}
#top{top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand{font-size:17px;font-weight:900;color:#79fff0}
.stat{font-size:13px;margin-top:5px}
#build{bottom:12px;left:10px;right:10px;display:flex;gap:7px;justify-content:center;flex-wrap:wrap}
button{border:0;border-radius:10px;padding:11px 12px;background:#21c9a6;color:#052a2b;font-weight:800;font-size:12px;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.96)}
button:disabled{opacity:.45}
#hint{position:fixed;z-index:2;top:94px;left:50%;transform:translateX(-50%);background:#071c2ddd;padding:9px 13px;border-radius:20px;font-size:12px;text-align:center;white-space:nowrap}
#toast{position:fixed;z-index:5;top:145px;left:50%;transform:translateX(-50%);background:#ffda78;color:#17303c;padding:11px 15px;border-radius:12px;font-weight:bold;display:none;text-align:center}
#reset{position:fixed;right:12px;top:94px;z-index:3;background:#e7f2ff;color:#16344a}
.small{font-size:10px;color:#b6d4df}
@media(min-width:700px){#top{left:20px;right:20px;top:20px}.panel{padding:16px}#build{bottom:20px}button{font-size:14px;padding:14px 18px}#hint{top:110px}}
</style>
</head>
<body>
<div id="game"></div>
<div id="loading" style="position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#071c2d;font-size:22px;font-weight:bold">🏝️ Building your island...</div>
<div id="top" class="panel">
<div><div class="brand">🏝️ ISLAND TYCOON</div><div class="stat">Island Level <b id="level">1</b></div></div>
<div style="text-align:right"><div style="font-size:20px;font-weight:900;color:#8affb8">💰 $<span id="money">500</span></div><div class="stat">Income: $<span id="income">0</span>/sec</div></div>
</div>
<div id="hint">Drag to rotate • Pinch or scroll to zoom</div>
<button id="reset" onclick="resetGame()">Reset</button>
<div id="build" class="panel">
<button onclick="build('hotel')">🏨 Hotel $150</button>
<button onclick="build('restaurant')">🍽️ Restaurant $100</button>
<button onclick="build('pool')">🏊 Pool $80</button>
<button onclick="build('tree')">🌴 Palm $25</button>
<button onclick="build('villa')">🏡 Villa $250</button>
</div>
<div id="toast"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js';
const root=document.getElementById('game');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x80d9f5);
scene.fog=new THREE.Fog(0x80d9f5,35,85);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,200);
camera.position.set(18,19,25);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xc9f3ff,0x48734b,2.1));
const sun=new THREE.DirectionalLight(0xfff1cb,3);
sun.position.set(-12,24,12);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
scene.add(sun);
const mat=(color,roughness=.85)=>new THREE.MeshStandardMaterial({color,roughness});
const oceanMat=new THREE.MeshStandardMaterial({color:0x159ec4,roughness:.35,metalness:.05});
const grassMat=mat(0x5ebd64);
const sandMat=mat(0xf5d69a);
const woodMat=mat(0x8b5734);
const leafMat=mat(0x23965b);
const whiteMat=mat(0xf7f5e8);
const islandGroup=new THREE.Group();
scene.add(islandGroup);
const ocean=new THREE.Mesh(new THREE.PlaneGeometry(250,250),oceanMat);
ocean.rotation.x=-Math.PI/2;
ocean.position.y=-1.05;
scene.add(ocean);
const sand=new THREE.Mesh(new THREE.CylinderGeometry(12.2,13.1,1.7,64),sandMat);
sand.position.y=-.15;
sand.receiveShadow=true;
islandGroup.add(sand);
const land=new THREE.Mesh(new THREE.CylinderGeometry(11.5,12.3,1.2,64),grassMat);
land.position.y=.7;
land.receiveShadow=true;
land.castShadow=true;
islandGroup.add(land);
const path=new THREE.Mesh(new THREE.BoxGeometry(2,.08,14),mat(0xe6c78b));
path.position.set(0,1.34,0);
islandGroup.add(path);
const buildings=[];
const trees=[];
let money=500,income=0,level=1,nextId=0;
let rotY=0,rotX=.35,zoom=29;
let dragging=false,lastX=0,lastY=0;
let lastTime=performance.now();
let toastTimer;
function notify(text){
 const el=document.getElementById('toast');
 el.textContent=text;el.style.display='block';
 clearTimeout(toastTimer);
 toastTimer=setTimeout(()=>el.style.display='none',2100);
}
function updateUI(){
 document.getElementById('money').textContent=Math.floor(money);
 document.getElementById('income').textContent=income;
 document.getElementById('level').textContent=level;
}
function box(parent,w,h,d,material,x,y,z){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
 m.position.set(x,y+h/2,z);m.castShadow=true;m.receiveShadow=true;
 parent.add(m);return m;
}
function makePalm(x,z,scale=1){
 const g=new THREE.Group();g.position.set(x,1.3,z);
 const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.13*scale,.2*scale,1.6*scale,7),woodMat);
 trunk.position.y=.8*scale;trunk.castShadow=true;g.add(trunk);
 for(let i=0;i<7;i++){
  const a=i*Math.PI*2/7;
  const leaf=new THREE.Mesh(new THREE.ConeGeometry(.22*scale,1.7*scale,5),leafMat);
  leaf.position.set(Math.cos(a)*.62*scale,1.55*scale,Math.sin(a)*.62*scale);
  leaf.rotation.z=-Math.cos(a)*.85;
  leaf.rotation.x=Math.sin(a)*.85;
  leaf.castShadow=true;g.add(leaf);
 }
 islandGroup.add(g);trees.push(g);
}
function makeBuilding(type,x,z){
 const g=new THREE.Group(),baseY=1.3;
 let color=0xffffff,h=2.5,w=2.3,d=2.3,roof=0xff824d;
 if(type==='hotel'){color=0xf3f0dd;h=4.3;w=3.2;d=2.7;roof=0xe75d51}
 if(type==='restaurant'){color=0xffdf9e;h=2.4;w=2.8;d=2.4;roof=0x6dbe79}
 if(type==='villa'){color=0xf6f0df;h=2.3;w=2.5;d=2.5;roof=0x4d78b9}
 if(type==='pool'){
  const water=new THREE.Mesh(new THREE.BoxGeometry(3.1,.16,2.6),mat(0x28c8ee,.3));
  water.position.y=1.4;g.add(water);
  const edge=mat(0xffffff);
  box(g,3.3,.18,.18,edge,0,1.28,-1.35);
  box(g,3.3,.18,.18,edge,0,1.28,1.35);
  box(g,.18,.18,2.6,edge,-1.55,1.28,0);
  box(g,.18,.18,2.6,edge,1.55,1.28,0);
  g.position.set(x,0,z);islandGroup.add(g);return g;
 }
 box(g,w,h,d,mat(color),0,baseY,0);
 const roofMesh=new THREE.Mesh(new THREE.ConeGeometry(Math.max(w,d)*.77,1.3,4),mat(roof));
 roofMesh.position.set(0,baseY+h+.65,0);
 roofMesh.rotation.y=Math.PI/4;roofMesh.castShadow=true;g.add(roofMesh);
 const windowMat=mat(0x72d7ee,.3);
 for(let i=0;i<(type==='hotel'?3:2);i++){
  box(g,.38,.5,.07,windowMat,-w*.28+i*w*.28,baseY+h*.6,d/2+.04);
 }
 box(g,.45,.9,.09,woodMat,0,baseY,d/2+.05);
 g.position.set(x,0,z);islandGroup.add(g);return g;
}
const costs={hotel:150,restaurant:100,pool:80,tree:25,villa:250};
const earnings={hotel:16,restaurant:9,pool:5,tree:1,villa:12};
const labels={hotel:'Hotel',restaurant:'Restaurant',pool:'Swimming pool',tree:'Palm tree',villa:'Villa'};
function placement(index){
 const spots=[[-3,-4],[3,-4],[-4,1],[4,1],[0,4],[-6,-2],[6,-2],[-2,7],[3,7],[-7,4],[7,4],[0,-7],[-5,-6],[5,-6],[-7,0],[7,0]];
 return spots[index%spots.length];
}
function build(type){
 if(money<costs[type]){notify('Not enough money!');return}
 money-=costs[type];
 const [x,z]=placement(nextId++);
 let object;
 if(type==='tree'){makePalm(x,z,.85);object=trees[trees.length-1]}
 else object=makeBuilding(type,x,z);
 buildings.push({type,object});
 income+=earnings[type];
 level=1+Math.floor(buildings.length/3);
 updateUI();saveGame();
 notify(labels[type]+' built! +$'+earnings[type]+'/sec');
}
function saveGame(){
 try{localStorage.setItem('islandTycoonSave',JSON.stringify({money,buildings:buildings.map(b=>b.type)}))}catch(e){}
}
function loadGame(){
 try{
  const data=JSON.parse(localStorage.getItem('islandTycoonSave')||'null');
  if(!data)return;
  money=Number(data.money)||500;nextId=0;income=0;
  (data.buildings||[]).forEach(type=>{
   if(!costs[type])return;
   const [x,z]=placement(nextId++);
   let object;
   if(type==='tree'){makePalm(x,z,.85);object=trees[trees.length-1]}
   else object=makeBuilding(type,x,z);
   buildings.push({type,object});income+=earnings[type];
  });
  level=1+Math.floor(buildings.length/3);
 }catch(e){}
 updateUI();
}
window.build=build;
window.resetGame=()=>{
 if(!confirm('Start a new island? Saved progress will be erased.'))return;
 localStorage.removeItem('islandTycoonSave');location.reload();
};
loadGame();
function setCamera(){
 camera.position.set(Math.sin(rotY)*Math.cos(rotX)*zoom,Math.sin(rotX)*zoom,Math.cos(rotY)*Math.cos(rotX)*zoom);
 camera.lookAt(0,1,0);
}
setCamera();
renderer.domElement.addEventListener('pointerdown',e=>{
 dragging=true;lastX=e.clientX;lastY=e.clientY;
 renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener('pointermove',e=>{
 if(!dragging)return;
 rotY-=(e.clientX-lastX)*.008;
 rotX=Math.max(.12,Math.min(1.15,rotX+(e.clientY-lastY)*.006));
 lastX=e.clientX;lastY=e.clientY;setCamera();
});
renderer.domElement.addEventListener('pointerup',()=>dragging=false);
renderer.domElement.addEventListener('pointercancel',()=>dragging=false);
renderer.domElement.addEventListener('wheel',e=>{
 zoom=Math.max(17,Math.min(43,zoom+e.deltaY*.025));setCamera();
},{passive:true});
let previousPinch=0;
renderer.domElement.addEventListener('touchmove',e=>{
 if(e.touches.length===2){
  const dx=e.touches[0].clientX-e.touches[1].clientX;
  const dy=e.touches[0].clientY-e.touches[1].clientY;
  const dist=Math.sqrt(dx*dx+dy*dy);
  if(previousPinch)zoom=Math.max(17,Math.min(43,zoom+(previousPinch-dist)*.035));
  previousPinch=dist;setCamera();
 }else previousPinch=0;
},{passive:true});
renderer.domElement.addEventListener('touchend',()=>previousPinch=0);
function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min((now-lastTime)/1000,.1);lastTime=now;
 ocean.position.y=-1.05+Math.sin(now*.0005)*.035;
 if(income>0){money+=income*dt;updateUI()}
 renderer.render(scene,camera);
}
requestAnimationFrame(animate);
addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
});
document.getElementById('loading').style.display='none';
updateUI();
</script>
</body>
</html>
